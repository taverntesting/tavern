repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml]
        exclude: (example/)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          # Keep in sync with the protobuf/types-protobuf pins in pyproject.toml
          - "types-protobuf>=5,<6"
          - types-PyYAML
          - mypy-extensions
        exclude: (tests|example/)
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.5
    hooks:
      - id: uv-lock

exclude: (docs/)
