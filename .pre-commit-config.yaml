repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        args: ["-shellcheck="]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        types_or: [yaml]
        exclude: (example/)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          # Keep in sync with the protobuf/types-protobuf pins in pyproject.toml
          - "types-protobuf>=7.35.1.20260906,<8"
          - types-PyYAML
          - mypy-extensions
        exclude: (tests|example/)
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.23
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: starlark-docstring-markdown
        name: starlark-docstring-markdown
        entry: uv
        args:
          - tool
          - run
          - git+https://github.com/michaelboulton/starlark-docstring-markdown@df06acc9307e9ad8bd83fe618f012072f288d3d1
          - tavern/tavern/_core/starlark/
          - tavern/docs/source/scripting-api.md
        language: system
        pass_filenames: false
        files: \.star$

exclude: (docs/)
